<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
   <link rel="stylesheet" href="/style.css">
  <meta property="og:title" content="🙏함께 기도해요🙏" />
<meta property="og:description" content="별처럼 빛나는 공동체" />
<meta property="og:image" content="https://vivacehoney-prayer.onrender.com/thumbnail.png" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://vivacehoney-prayer.onrender.com/" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
</head>

<body class="mobile">

  <main class="mobile-wrap">

    <div class="share-header">
      <div class="eyebrow">PRAYER TOGETHER</div>

      <h1>
        옥토 기도 나눔
        <span class="pray-symbol">🙏</span>
      </h1>

      <p class="intro">
        함께 기도하면 하나님이 들으십니다.<br>
        기도제목을 나누고 서로를 위해 기도해주세요.
      </p>
    </div>

    <form id="form" class="form-card compact-form">

      <label for="name">
        이름 <span>(선택)</span>
      </label>

      <input
        id="name"
        type="text"
        maxlength="30"
        placeholder="익명으로 남겨도 됩니다">

      <label for="text">
        기도제목
      </label>

      <div class="textarea-wrap">
        <textarea
          id="text"
          maxlength="300"
          required
          placeholder="예: 가족의 건강과 회복을 위해 기도해 주세요."></textarea>

        <div class="char">
          <span id="count">0</span>/300
        </div>
      </div>

      <button id="submitBtn" type="submit">
        기도제목 나누기
      </button>

      <div id="message" class="message"></div>

    </form>

    <!-- 🏠 홈 화면 이동 버튼 -->
    <div class="home-btn-wrap">
      <a href="/" class="home-btn">
        🏠 "함께 기도해요" 홈 화면으로 이동
      </a>
    </div>

    <p class="privacy">
      개인정보·연락처·민감한 정보는 입력하지 않는 것을 권장합니다.
    </p>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/pray.js"></script>

</body>
</html>
