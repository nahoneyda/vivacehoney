<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>함께 기도해요</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="screen">
  <main class="screen-wrap">
    <section class="hero">
      <div class="eyebrow">PRAYER TOGETHER</div>
      <h1>함께 기도해요</h1>
      <p>QR코드를 찍고 기도제목을 남겨 주세요.<br>등록된 기도제목이 화면에 함께 나눠집니다.</p>
    </section>

    <section class="display-grid">
      <div class="qr-card">
        <img id="qr" alt="기도제목 입력 QR코드" />
        <div id="prayUrl" class="url"></div>
        <div class="qr-label">휴대폰 카메라로 QR을 스캔하세요</div>
      </div>

      <div class="prayer-card">
        <div class="prayer-label">지금 함께 기도할 제목</div>
        <div id="prayerText" class="prayer-text">기도제목을 기다리고 있습니다.</div>
        <div id="prayerName" class="prayer-name"></div>
        <div id="counter" class="counter">등록 0건</div>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/screen.js"></script>
</body>
</html>
