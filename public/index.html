<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
  <meta property="og:title" content="🙏함께 기도해요🙏" />
<meta property="og:description" content="별처럼 빛나는 공동체" />
<meta property="og:image" content="https://vivacehoney-prayer.onrender.com/thumbnail.png" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://vivacehoney-prayer.onrender.com/" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
</head>
<body class="screen">
  <main class="screen-wrap">
    <section class="hero">
      <div class="eyebrow">PRAYER TOGETHER</div>
      <h1>함께 기도해요</h1>
      <p>QR코드를 찍고 기도제목을 남겨 주세요.<br>등록된 기도제목이 화면에 함께 나눠집니다.</p>
    </section>

    <!-- QR 카드 영역 -->
    <section class="qr-section">
      <div id="qrCard" class="qr-card">
        <button id="qrToggleBtn" class="qr-toggle-btn" type="button" title="QR 코드 축소/확대">
          <span id="zoomIcon">🔍 −</span>
        </button>

        <div class="qr-body">
          <img id="qr" alt="기도제목 입력 QR코드" />
          <div id="prayUrl" class="url"></div>
          <div class="qr-label">휴대폰 카메라로 QR을 스캔하세요</div>
        </div>
      </div>
    </section>

    <!-- 전체 기도 목록 (가로 스크롤 없음, 자동 줄바꿈) -->
    <section class="recent-prayers-section">
      <div class="recent-header">
        <span id="counter" class="counter-badge">등록 0건</span>
      </div>
      <div id="recentPrayerList" class="recent-prayer-list">
        <!-- 스크립트에서 자동 생성 -->
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/screen.js"></script>
</body>
</html>
